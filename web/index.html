<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3f7a">
<title>肠道菌群健康顾问</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232b3f7a'/%3E%3Cpath d='M8 21c0-5.4 3.3-9 8-9s8 3.6 8 9' fill='none' stroke='%23a9c0ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9.5' r='2.4' fill='%23a9c0ff'/%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1b2333;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 580px at 10% -10%,#dee7ff 0%,rgba(222,231,255,0) 60%),
      radial-gradient(950px 520px at 94% 2%,#e7e2ff 0%,rgba(231,226,255,0) 56%),
      linear-gradient(180deg,#f6f8fd 0%,#eef2fb 100%);
  }
  .shell{display:flex;height:100%}

  /* 侧栏 */
  .side{width:266px;flex:none;padding:22px 18px;display:flex;flex-direction:column;gap:20px;
    background:linear-gradient(170deg,#2b3f7a 0%,#1f2f60 100%);color:#e8edfb;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:linear-gradient(140deg,#7ea2ff,#a58bff);color:#16204a;font-weight:700;font-size:15px}
  .brand h1{margin:0;font-size:15.5px;font-weight:650}
  .brand p{margin:2px 0 0;font-size:11.5px;color:#a9b8e4}
  .side h2{margin:0 0 9px;font-size:11.5px;font-weight:600;color:#93a5d8;letter-spacing:1.1px}
  .quick{display:flex;flex-direction:column;gap:6px}
  .quick button{text-align:left;font:inherit;font-size:12.5px;color:#dbe3f8;cursor:pointer;
    padding:8px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.05);transition:background .15s,border-color .15s}
  .quick button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25)}
  .grades{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:#b9c6ea}
  .grades div{display:flex;gap:8px;align-items:baseline}
  .gr{flex:none;width:17px;height:17px;border-radius:5px;font-size:10px;font-weight:700;
    display:grid;place-items:center;color:#16204a}
  .gr.A{background:#7ee0b8}.gr.B{background:#9fd0ff}.gr.C{background:#ffd88a}
  .gr.D{background:#ffb3a7}.gr.E{background:#d9d3e8}
  .side footer{margin-top:auto;font-size:11px;color:#8496c9;line-height:1.75}

  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;background:rgba(255,255,255,.74);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(20,40,90,.07)}
  .topbar strong{font-size:14.5px;font-weight:620}
  .topbar span{font-size:12px;color:#6d7a96;margin-left:10px}
  .devbtn{font:inherit;font-size:11.5px;color:#8b97b3;background:none;border:0;cursor:pointer;
    padding:4px 8px;border-radius:6px}
  .devbtn:hover{background:rgba(20,40,90,.06);color:#46527a}

  .stream{flex:1;overflow-y:auto;padding:26px 26px 8px}
  .inner{max-width:790px;margin:0 auto}
  .row{display:flex;margin-bottom:20px}
  .row.me{justify-content:flex-end}
  .bubble{max-width:87%;padding:14px 17px;border-radius:16px;font-size:14.5px;line-height:1.85;
    word-break:break-word}
  .row.me .bubble{background:linear-gradient(140deg,#4f74e8,#6a63e0);color:#fff;
    border-bottom-right-radius:5px;white-space:pre-wrap}
  .row.bot .bubble{background:#fff;border:1px solid rgba(20,40,90,.08);
    border-bottom-left-radius:5px;box-shadow:0 3px 18px rgba(31,47,96,.06)}
  .row.bot.alarm .bubble{background:#fffaf3;border-color:#f0c690;
    box-shadow:0 3px 18px rgba(190,120,20,.10)}
  .alarmtag{display:inline-block;font-size:11.5px;font-weight:650;color:#9a5b12;
    background:#fdecd2;padding:3px 9px;border-radius:6px;margin-bottom:9px}
  .body{white-space:pre-wrap}
  .bubble b{font-weight:650}
  .cite{display:inline-block;min-width:17px;height:17px;padding:0 4px;margin:0 1px;
    border-radius:5px;background:#eaefff;color:#4759a8;font-size:11px;font-weight:650;
    text-align:center;line-height:17px;vertical-align:1px}

  .tools{margin-top:11px;display:flex;gap:8px;align-items:center}
  .tool{font:inherit;font-size:12.5px;font-weight:550;color:#3f5bb8;background:#eef3ff;
    border:1px solid #c9d8fb;border-radius:20px;padding:6px 14px 6px 10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
  .tool:hover{background:#dfe8ff;border-color:#a9c0f5}
  .tool[disabled]{opacity:.55;cursor:default}
  .tool svg{width:15px;height:15px;flex:none;fill:currentColor}
  .tool.playing{background:#e4ecff;border-color:#8fabf0}

  .srcs{margin-top:12px;padding-top:11px;border-top:1px dashed rgba(20,40,90,.13)}
  .srcs summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:600;color:#7b88a6;
    display:flex;align-items:center;gap:6px;user-select:none;padding:2px 0}
  .srcs summary::-webkit-details-marker{display:none}
  .srcs summary:hover{color:#46527a}
  .srcs summary .chev{transition:transform .15s;font-size:9px;color:#a3adc4}
  .srcs[open] summary .chev{transform:rotate(90deg)}
  .srcs .list{margin-top:6px}
  .src{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#46527a;
    padding:5px 0;line-height:1.6}
  .src .n{flex:none;width:18px;height:18px;border-radius:5px;background:#eaefff;color:#4759a8;
    font-size:11px;font-weight:650;display:grid;place-items:center}
  .src a{color:#4759a8;text-decoration:none;border-bottom:1px solid rgba(71,89,168,.25)}
  .src a:hover{border-bottom-color:#4759a8}
  .badge{flex:none;font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:5px;color:#16204a}
  .badge.A{background:#d5f5e8}.badge.B{background:#dbecff}.badge.C{background:#ffeecb}
  .badge.D{background:#ffe0da}.badge.E{background:#ece8f5}
  .badge.live,.badge.none{background:#e6eaf3;color:#5a6584}

  .dev{margin-top:10px;font-size:11.5px;color:#8b97b3;line-height:1.8;display:none;
    border-top:1px dashed rgba(20,40,90,.13);padding-top:9px}
  body.showdev .dev{display:block}

  .typing{display:flex;gap:4px;padding:5px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#a9b4cf;animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28}30%{opacity:1}}

  .composer{flex:none;padding:12px 26px 20px}
  .cbox{max-width:790px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:#fff;
    border:1px solid rgba(20,40,90,.11);border-radius:16px;padding:10px 10px 10px 16px;
    box-shadow:0 6px 26px rgba(31,47,96,.07)}
  .cbox:focus-within{border-color:#9db1ee;box-shadow:0 6px 26px rgba(79,116,232,.16)}
  .cbox textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:14.5px;
    line-height:1.7;max-height:150px;background:transparent;color:#1b2333}
  .cbox textarea::placeholder{color:#a3adc4}
  .send{flex:none;width:36px;height:36px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(140deg,#4f74e8,#6a63e0);color:#fff;font-size:16px;
    display:grid;place-items:center;transition:opacity .15s}
  .send:disabled{opacity:.38;cursor:default}
  .foot{max-width:790px;margin:9px auto 0;font-size:11px;color:#8b97b3;text-align:center;line-height:1.7}

  @media (max-width:820px){
    .side{display:none}
    .stream,.composer{padding-left:15px;padding-right:15px}
    .bubble{max-width:94%}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark">菌</div>
      <div><h1>肠道菌群健康顾问</h1><p>按证据等级说话</p></div>
    </div>
    <div><h2>常见问题</h2><div class="quick" id="quick"></div></div>
    <div>
      <h2>证据等级</h2>
      <div class="grades">
        <div><span class="gr A">A</span><span>人体试验的荟萃分析</span></div>
        <div><span class="gr B">B</span><span>单个人体随机对照试验</span></div>
        <div><span class="gr C">C</span><span>观察性研究，只能说相关</span></div>
        <div><span class="gr D">D</span><span>动物或体外实验</span></div>
        <div><span class="gr E">E</span><span>专家意见或机制推测</span></div>
      </div>
    </div>
    <footer>做科普与就医导航，不做诊断、不开处方、不解读化验单。<br>出现报警症状请直接就医。</footer>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><strong>健康咨询</strong><span>每条结论都标注来源与证据等级</span></div>
      <button class="devbtn" id="devbtn">技术细节</button>
    </div>
    <div class="stream" id="stream"><div class="inner" id="inner"></div></div>
    <div class="composer">
      <div class="cbox">
        <textarea id="q" rows="1" placeholder="说说你的情况，或者直接问一个问题"></textarea>
        <button class="send" id="send" title="发送">↑</button>
      </div>
      <div class="foot">内容依据公开研究整理并标注证据等级，仅供参考，不能替代医生的面诊与判断。</div>
    </div>
  </div>
</div>

<script>
(function(){
  var QUICK=["益生菌到底有没有用","益生菌怎么选","吃完抗生素要不要补益生菌",
             "宝宝可以吃益生菌吗","每天要吃多少膳食纤维","肠道菌群检测有用吗"];
  var stream=document.getElementById("stream"),inner=document.getElementById("inner"),
      box=document.getElementById("q"),send=document.getElementById("send");
  var history=[],busy=false,player=null;

  QUICK.forEach(function(t){
    var b=document.createElement("button");b.textContent=t;
    b.onclick=function(){if(!busy){box.value=t;submit();}};
    document.getElementById("quick").appendChild(b);
  });
  document.getElementById("devbtn").onclick=function(){document.body.classList.toggle("showdev");};

  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

  // 顺序不能反：模型输出是不可信内容，必须先整体转义，再做轻量排版。
  function render(t){
    return esc(t).replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
                 .replace(/\[(\d{1,3})\]/g,'<span class="cite">$1</span>');
  }

  function row(kind,extra){
    var r=document.createElement("div");r.className="row "+kind+(extra?" "+extra:"");
    var b=document.createElement("div");b.className="bubble";r.appendChild(b);
    inner.appendChild(r);stream.scrollTop=stream.scrollHeight;return b;
  }

  function sources(list){
    if(!list||!list.length)return "";
    // Collapsed by default: the citations are what make this trustworthy,
    // but showing eight of them by default buries the actual answer.
    var h='<details class="srcs"><summary><span class="chev">&#9654;</span>'
        + '依据 '+list.length+' 条</summary><div class="list">';
    list.forEach(function(s){
      var g=s.is_live?"live":(s.grade||"none");
      var label=s.is_live?"实时":(s.grade||"未标注");
      var title=esc(s.heading||s.doc||"资料");
      var link=(s.links&&s.links[0]&&s.links[0].url)||(s.citations&&s.citations[0])||s.url||"";
      h+='<div class="src"><span class="n">'+esc(s.n)+'</span><span class="badge '+esc(g)+'">'
        +esc(label)+'</span><span>'
        +(link?'<a href="'+esc(link)+'" target="_blank" rel="noopener">'+title+'</a>':title)
        +'</span></div>';
    });
    return h+"</div></details>";
  }

  function devinfo(st){
    if(!st)return "";
    var b=["检索 "+st.passages+" 段，引用 "+st.cited+" 段"];
    if(st.used_live)b.push("含实时检索");
    if(st.repairs)b.push("重写 "+st.repairs+" 次");
    if(st.classifier_fallback)b.push("分流降级");
    b.push("耗时 "+st.elapsed+"s");
    if(st.provider)b.push(st.provider);
    return '<div class="dev">'+esc(b.join(" · "))+"</div>";
  }

  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.9 8.9 0 0 0 0-17.6z"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 24 24"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>';

  function attachAudio(bubble,text){
    var bar=document.createElement("div");bar.className="tools";
    var btn=document.createElement("button");btn.className="tool";
    btn.innerHTML=ICON_PLAY+"<span>朗读</span>";
    function reset(){btn.className="tool";btn.innerHTML=ICON_PLAY+"<span>朗读</span>";}
    btn.onclick=function(){
      if(player&&!player.paused){player.pause();player=null;reset();return;}
      btn.disabled=true;btn.innerHTML=ICON_PLAY+"<span>生成语音…</span>";
      fetch("/api/speak",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({text:text})})
        .then(function(r){
          if(r.status===503)throw new Error("本地模式已关闭朗读");
          if(!r.ok)throw new Error("语音服务暂时不可用");
          return r.json();
        })
        .then(function(d){
          if(!d.url)throw new Error("语音服务暂时不可用");
          if(player)player.pause();
          // 直接给 <audio> 一个 URL，让浏览器边下边播；
          // 等整段 blob 下载完要几十秒，那期间按钮只能一直显示「生成语音…」。
          player=new Audio(d.url);
          player.onended=function(){player=null;reset();};
          player.onplaying=function(){
            btn.disabled=false;btn.className="tool playing";
            btn.innerHTML=ICON_STOP+"<span>停止</span>";
          };
          return player.play();
        })
        .catch(function(e){
          btn.disabled=false;
          btn.innerHTML=ICON_PLAY+"<span>"+(e&&e.message?e.message:"朗读失败")+"</span>";
          setTimeout(reset,3000);
        });
    };
    bar.appendChild(btn);bubble.appendChild(bar);
  }

  function submit(){
    var text=box.value.trim();
    if(!text||busy)return;
    busy=true;send.disabled=true;box.value="";box.style.height="auto";
    row("me").textContent=text;
    var b=row("bot");
    b.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';

    var acc="", meta={}, started=false;
    function paint(final){
      b.innerHTML=(meta.escalated?'<div class="alarmtag">建议尽快就医</div>':"")
        +'<div class="body">'+render(acc)+"</div>"
        +(final?sources(final.sources)+devinfo(final.stats):"");
      if(final&&acc.length>12)attachAudio(b,acc);
      stream.scrollTop=stream.scrollHeight;
    }

    fetch("/api/chat/stream",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({message:text,history:history})})
      .then(function(r){
        if(!r.ok||!r.body)throw 0;
        var reader=r.body.getReader(), dec=new TextDecoder(), buf="";
        function pump(){
          return reader.read().then(function(res){
            if(res.done)return;
            buf+=dec.decode(res.value,{stream:true});
            var parts=buf.split("\n\n"); buf=parts.pop();
            parts.forEach(function(chunk){
              var line=chunk.replace(/^data: /,"").trim();
              if(!line)return;
              var ev; try{ev=JSON.parse(line);}catch(e){return;}
              if(ev.kind==="meta"){meta=ev.payload||{};}
              else if(ev.kind==="delta"){
                if(!started){started=true;b.innerHTML="";}
                acc+=ev.payload; paint(null);
              } else if(ev.kind==="replace"){
                acc=ev.payload.answer||""; paint({sources:ev.payload.sources,stats:null});
              } else if(ev.kind==="done"){
                acc=ev.payload.answer||acc; paint({sources:ev.payload.sources,stats:null});
              }
            });
            return pump();
          });
        }
        return pump();
      })
      .then(function(){
        if(!acc){b.textContent="这一轮没能生成回答，请再问一次。";return;}
        history.push({role:"user",content:text});
        history.push({role:"assistant",content:acc});
        if(history.length>12)history=history.slice(-12);
      })
      .catch(function(){b.textContent="连接不上服务，请稍后再试。";})
      .then(function(){busy=false;send.disabled=false;
        stream.scrollTop=stream.scrollHeight;box.focus();});
  }

  send.onclick=submit;
  box.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}});
  box.addEventListener("input",function(){
    box.style.height="auto";box.style.height=Math.min(box.scrollHeight,150)+"px";});

  row("bot").innerHTML='<div class="body">你好。我可以帮你弄清楚肠道健康方面哪些说法有依据、哪些只是流传得广。\n\n'
    +'回答里每条结论都会标出处和证据等级——A 是人体试验的荟萃分析，D、E 只是动物实验或推测，'
    +'我会直说哪些还不能下结论。\n\n如果你有具体症状，直接描述就行。</div>';
  box.focus();
})();
</script>
</body>
</html>
